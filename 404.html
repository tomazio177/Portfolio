<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Tomás Santos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">

<!-- caminhos absolutos (o site vive em /portfolio/): o GitHub Pages serve
     esta página em qualquer endereço que não exista, incluindo subpastas,
     onde os relativos partiam -->
<link rel="icon" href="/portfolio/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;family=TikTok+Sans:opsz,wght@12..36,700&amp;family=Geist:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/portfolio/css/styles.css">

<style>
  /* aqui não há main.js nem cursor personalizado: devolve o do sistema */
  html, body, a, .btn { cursor: auto; }
  a.btn { cursor: pointer; }

  .lost {
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 32px var(--gutter);
    text-align: center;
    overflow: hidden;
  }
  .lost-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 4vh, 34px);
  }
  .lost-obj {
    width: clamp(220px, 34vw, 460px);
    height: auto;
    filter: drop-shadow(0 24px 60px rgba(255, 255, 255, .08));
    animation: lost-orbit 9s ease-in-out infinite;
  }
  @keyframes lost-orbit {
    0%, 100% { translate: 0 0;     rotate: -4deg; }
    50%      { translate: 0 -16px; rotate: 3deg; }
  }
  .lost-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(34px, 6vw, 88px);
    line-height: .95;
    letter-spacing: -.03em;
    text-transform: uppercase;
    color: var(--fg);
    text-wrap: balance;
  }
  .lost-text {
    margin: 0;
    max-width: 42ch;
    font-family: var(--font-body);
    font-size: clamp(16px, 1.3vw, 19px);
    line-height: 1.5;
    color: var(--fg-dim);
    text-wrap: pretty;
  }
  @media (prefers-reduced-motion: reduce) { .lost-obj { animation: none; } }
</style>
</head>
<body>

<main class="lost">
  <div class="lost-inner">
    <img class="lost-obj" src="/portfolio/assets/obj-saturn.webp" alt="" width="560" height="282">
    <h1 class="lost-title">Perdeste-te<br>no espaço.</h1>
    <p class="lost-text">Erro 404: esta página não existe ou mudou de sítio. O resto do portefólio continua em órbita.</p>
    <a class="btn btn--solid" href="/portfolio/">Voltar ao início</a>
  </div>
</main>

</body>
</html>
